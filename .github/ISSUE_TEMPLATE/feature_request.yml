name: Feature request
description: Suggest an idea or an improvement.
labels: ["type: feature"]
body:
  - type: markdown
    attributes:
      value: |
        OpenTurnly tries to stay simple to install and use. Tell us the problem first;
        we can find the simplest solution together.
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Who has this problem (business owner, staff, customer, self-hoster) and when?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: What would you like to happen?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you handle it today?
